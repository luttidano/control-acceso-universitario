version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: control-acceso-universitario-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin4321
      POSTGRES_DB: control_acceso_universitario_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: control_acceso_universitario_qdrant
    ports:
      - "6333:6333" # API HTTP / Dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: