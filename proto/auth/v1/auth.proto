syntax = "proto3";

package auth.v1;

option go_package = "backend/gen/auth/v1;authv1";

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string role = 2;
  string user_id = 3;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
}